<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marist CRM — Imadi</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#09101f;color:#edf2ff}.wrap{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{font-size:25px;font-weight:800}.muted{color:#93a1c0}.key{display:flex;gap:8px}.key input,.search{background:#111b31;border:1px solid #293957;color:#fff;border-radius:10px;padding:11px 12px}.btn{background:#eef2ff;color:#0b1020;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:24px 0}.stat{background:#111b31;border:1px solid #24324e;border-radius:16px;padding:17px}.stat b{display:block;font-size:27px;margin-top:6px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:#111b31;border:1px solid #24324e;border-radius:18px;overflow:hidden}.panel h2{font-size:17px;margin:0;padding:18px;border-bottom:1px solid #24324e}.tools{padding:12px;border-bottom:1px solid #24324e}.lead{padding:15px 18px;border-bottom:1px solid #202e49;cursor:pointer}.lead:hover{background:#16213a}.row{display:flex;justify-content:space-between;gap:12px}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#243454}.detail{padding:20px;min-height:500px}.chat{max-height:360px;overflow:auto;margin-top:16px}.bubble{padding:10px 12px;border-radius:12px;margin:9px 0;max-width:90%;background:#192640}.in{margin-right:auto}.out{margin-left:auto;background:#172f2a}.section{border-top:1px solid #293957;margin-top:18px;padding-top:16px}.pill{display:inline-block;background:#1d2942;padding:6px 9px;border-radius:8px;margin:3px;font-size:12px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">Marist CRM</div><div class="muted">AI Technology Consultant · Imadi Technologies</div></div><div class="key"><input id="key" type="password" placeholder="Admin API key"><button class="btn" onclick="load()">Connect</button></div></div><div class="grid" id="stats"></div><div class="layout"><section class="panel"><h2>Leads</h2><div class="tools"><input class="search" id="search" placeholder="Search company, industry, problem..." oninput="renderLeads()"></div><div id="leads"></div></section><section class="panel"><h2>Conversation & Solution</h2><div class="detail" id="detail"><div class="muted">Connect with your admin key, then select a lead.</div></div></section></div></div><script>
let DATA=[],DETAILS={};const $=id=>document.getElementById(id);function headers(){return {'x-admin-key':$('key').value}}async function api(path){const r=await fetch('/api/admin'+path,{headers:headers()});if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){try{const [s,l]=await Promise.all([api('/stats'),api('/leads')]);DATA=l;$('stats').innerHTML=Object.entries({Users:s.users,Conversations:s.conversations,Messages:s.messages,Leads:s.leads,Qualified:s.qualified_leads,Solutions:s.solutions}).map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join('');renderLeads()}catch(e){alert('Could not connect. Check the admin API key.')}}
function renderLeads(){const q=$('search').value.toLowerCase();const rows=DATA.filter(x=>JSON.stringify(x).toLowerCase().includes(q));$('leads').innerHTML=rows.map(x=>`<div class="lead" onclick="openLead(${x.conversation_id})"><div class="row"><b>${x.company||x.contact_name||'Unnamed lead'}</b><span class="badge">${x.priority}</span></div><div class="muted">${x.industry||'Industry not captured'} · ${x.status}</div><div style="margin-top:7px">${x.last_message||'No message'}</div></div>`).join('')||'<div class="lead muted">No leads found.</div>'}
async function openLead(id){$('detail').innerHTML='<div class="muted">Loading…</div>';try{const d=await api('/conversations/'+id);DETAILS=id;let c=d.conversation;let html=`<b>${c.user.name||'Client'}</b><div class="muted">${c.user.phone} · ${c.user.language||'language unknown'} · ${c.status}</div><div class="chat">${d.messages.map(m=>`<div class="bubble ${m.direction==='inbound'?'in':'out'}"><b>${m.direction==='inbound'?'Client':'Marist'}:</b> ${escapeHtml(m.content)}</div>`).join('')}</div>`;if(d.solutions.length){html+=`<div class="section"><b>Proposed solutions</b>${d.solutions.map(s=>`<div style="margin-top:12px"><div class="pill">${s.category||'Solution opportunity'}</div><div><b>Problem:</b> ${escapeHtml(s.problem)}</div><div><b>Solution:</b> ${escapeHtml(s.solution)}</div><div class="muted">Confidence: ${s.confidence}%</div></div>`).join('')}</div>`}$('detail').innerHTML=html}catch(e){$('detail').innerHTML='<div class="muted">Unable to load conversation.</div>'}}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script></body></html>
