<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marist Admin</title><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0b1020;color:#eef2ff}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:22px 0}.card{background:#121a30;border:1px solid #263454;border-radius:16px;padding:18px}.num{font-size:32px;font-weight:800}.muted{color:#9aa8c7}.layout{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}}button,input{border:0;border-radius:10px;padding:11px}button{cursor:pointer;font-weight:700}.lead{padding:14px;border-top:1px solid #263454;cursor:pointer}.lead:hover{background:#18223e}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#263454;font-size:12px;margin-right:6px}.messages{max-height:520px;overflow:auto}.bubble{padding:10px 13px;margin:8px 0;border-radius:12px;max-width:85%;white-space:pre-wrap}.in{background:#263454}.out{background:#16372e;margin-left:auto}</style></head><body><div class="wrap"><div class="top"><div><h1>Marist</h1><div class="muted">Imadi AI Consultant — Lead Intelligence</div></div><div><input id="key" type="password" placeholder="Admin API key"><button onclick="load()">Refresh</button></div></div><section class="grid" id="stats"></section><div class="layout"><div class="card"><h2>Leads</h2><div id="leads">Loading…</div></div><div class="card"><h2 id="title">Conversation</h2><div id="detail" class="muted">Select a lead to inspect the full conversation and proposed solutions.</div></div></div></div><script>const key=()=>document.getElementById('key').value;async function api(path){const r=await fetch(path,{headers:{'x-admin-key':key()}});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){try{const s=await api('/api/admin/stats');document.getElementById('stats').innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><div class="muted">${k.replaceAll('_',' ')}</div><div class="num">${v}</div></div>`).join('');const ls=await api('/api/admin/leads');document.getElementById('leads').innerHTML=ls.length?ls.map(l=>`<div class="lead" onclick="show(${l.conversation_id},'${String(l.contact_name||l.phone||'Lead').replaceAll("'","\\'")}')"><b>${l.contact_name||l.phone||'Unknown client'}</b><br><span class="tag">${l.status}</span><span class="tag">${l.priority}</span><span class="tag">${l.industry||'Unknown industry'}</span><div class="muted">${l.last_message||''}</div></div>`).join(''):'No leads yet.'}catch(e){alert('Unable to load dashboard. Check the admin key and server.')}}async function show(id,name){const d=await api('/api/admin/conversations/'+id);document.getElementById('title').textContent=name+' — Conversation #'+id;document.getElementById('detail').innerHTML=`<div class="muted">Status: ${d.conversation.status} · Language: ${d.conversation.user.language||'detected per turn'}</div><div class="messages">${d.messages.map(m=>`<div class="bubble ${m.direction==='inbound'?'in':'out'}"><b>${m.direction==='inbound'?'Client':'Marist'}:</b> ${esc(m.content)}</div>`).join('')}</div><h3>Proposed solutions</h3>${d.solutions.length?d.solutions.map(s=>`<div class="card"><b>${s.category||'Potential solution'}</b><p><b>Problem:</b> ${esc(s.problem)}</p><p><b>Marist proposal:</b> ${esc(s.solution)}</p><div class="muted">Confidence: ${s.confidence}%</div></div>`).join(''):'<div class="muted">No structured solution captured yet.</div>'}`}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}load();</script></body></html>
